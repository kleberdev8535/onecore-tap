# Render Blueprint: backend (Spring Boot, Docker). Banco no Supabase; frontend na Vercel.
# Segredos (sync: false) são pedidos pelo Render ao criar o serviço e nunca ficam no repositório.
services:
  - type: web
    name: onecore-tap-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: ohio
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "4"
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: APP_URL
        value: https://onecore-tap.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://onecore-tap.vercel.app
      - key: PLATE_PUBLIC_BASE_URL
        value: https://onecore-tap.vercel.app/t/
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: API_DOCS_ENABLED
        value: "false"
      - key: MAIL_LOG_CONTENT
        value: "false"
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError -XX:TieredStopAtLevel=1"
